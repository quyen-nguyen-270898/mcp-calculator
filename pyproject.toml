[project]
name = "mcp-calculator"
version = "1.0.0"
description = "A simple MCP server for mathematical calculations with support for Python expressions, math and random modules"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Quyen Nguyen", email = "quyen.nguyen.270898@gmail.com" }
]
license = { text = "MIT" }
keywords = ["mcp", "calculator", "math", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/quyen-nguyen-270898/mcp-calculator"
Repository = "https://github.com/quyen-nguyen-270898/mcp-calculator"
Issues = "https://github.com/quyen-nguyen-270898/mcp-calculator/issues"

[project.scripts]
mcp-calculator = "mcp_calculator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/mcp_calculator/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_calculator"]
